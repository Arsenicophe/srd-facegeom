# Données : source de CelebA et emplacements sur Google Drive.
# Voir docs/protocole.md, section 3.

drive_root: /content/drive/MyDrive/srd-facegeom

celeba:
  # Copie des fichiers d'origine sur Hugging Face, figée à une révision précise.
  source:
    repo_id: Yuehao/celeba
    repo_type: dataset
    revision: 35ebb31405e9da028409199a494f2e77eb10f253
  # Dossier de destination, relatif à drive_root.
  dest_dir: data/celeba
  # Empreintes MD5 des fichiers officiels, reprises de torchvision
  # (torchvision.datasets.CelebA.file_list). Un fichier dont l'empreinte diffère
  # est refusé.
  files:
    img_align_celeba.zip: 00d2c5bc6d35e252742224ab0c1e8fcb
    identity_CelebA.txt: 32bd1bd63d3c78cd57e08160ec5ed1e2
    list_eval_partition.txt: d32c9cbf5e040fd4025c592c306e6668

# Partition par identité (étape 0f). Voir docs/protocole.md, section 3.
splits:
  # Découpage officiel de CelebA (list_eval_partition.txt) : 0, 1, 2.
  names:
    0: train
    1: val
    2: test
  # Les identités avec moins de photos sont retirées de toutes les parties
  # (lots 8 × 4 pour contrastive et triplet, mêmes données pour les 4 pertes).
  min_images_per_identity: 4
  # Dossier de sortie, relatif à la racine du dépôt (fichiers versionnés).
  output_dir: splits
