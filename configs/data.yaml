# Données : CelebA, partition, recadrage. Détail : docs/protocole.md, section 3.

drive_root: /content/drive/MyDrive/srd-facegeom

celeba:
  # Copie Hugging Face des fichiers d'origine, révision figée
  source:
    repo_id: Yuehao/celeba
    repo_type: dataset
    revision: 35ebb31405e9da028409199a494f2e77eb10f253
  dest_dir: data/celeba            # relatif à drive_root
  # MD5 officiels (torchvision.datasets.CelebA) ; un fichier différent est refusé
  files:
    img_align_celeba.zip: 00d2c5bc6d35e252742224ab0c1e8fcb
    identity_CelebA.txt: 32bd1bd63d3c78cd57e08160ec5ed1e2
    list_eval_partition.txt: d32c9cbf5e040fd4025c592c306e6668

splits:
  names: {0: train, 1: val, 2: test}  # codes de list_eval_partition.txt
  min_images_per_identity: 4          # exigé par les lots 8 × 4, appliqué à toutes les parties
  output_dir: splits                  # fichiers versionnés

crop:
  # Positions moyennes des repères CelebA (image alignée 178 × 218)
  center_x: 88.5
  eye_y: 111.2
  eye_rel: 0.46                       # yeux à 46 % de la hauteur, comme le gabarit ArcFace
  candidate_sizes: [178, 150, 128, 100]
  size: 128                           # retenu le 2026-11-09 ; boîte (24, 52, 152, 180)
  sheet: {split: val, n_images: 10, seed: 0}   # planche d'inspection, jamais le test
