# Mesures préalables et évaluation (étape 2). Détail : docs/protocole.md, section 5.

features_root: features             # local (Mac) ; sur Colab : /content/drive/MyDrive/srd-facegeom/features
backbones: [resnet50_sup, resnet50_barlow]
resolutions: [112, 224]

fit_split: train                    # ajustement des projections
eval_split: val                     # mesure ; le test n'est jamais lu ici
dim: 128                            # commune à la tête, à la LDA et à l'ACP
runs_dir: runs                      # un dossier par passage, jamais écrasé

bootstrap: {n: 1000, seed: 0}       # sur les identités

verification:                       # toutes les paires positives + échantillon fixe de négatives
  n_negative: 1000000
  seed: 0
  fars: [0.1, 0.01, 0.001]

# Règle de décision fixée le 2026-11-09 avant tout calcul (points de MAP@R, %)
decision:
  margin_comfortable: 5.0           # LDA − brut ≥ 5 : on continue
  margin_minimum: 2.0               # < 2 : arrêt et discussion
  lda_minimum: 5.0                  # LDA < 5 % pour les deux : arrêt
  tie_breaker: resnet50_sup         # si les deux backbones sont « proches »

# Résultat de la règle (runs/20261109-182200_2e_decision)
selected: {backbone: resnet50_barlow, resolution: 224}
