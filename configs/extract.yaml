# Extraction des vecteurs (étape 1). Détail : docs/protocole.md, section 4.

# Même architecture et mêmes données ImageNet ; seul l'objectif de pré-entraînement
# diffère. Poids téléchargés directement et vérifiés par SHA-256.
backbones:
  resnet50_sup:
    description: ResNet-50 supervisé ImageNet, torchvision IMAGENET1K_V1
    url: https://download.pytorch.org/models/resnet50-0676ba61.pth
    sha256: 0676ba61b6795bbe1773cffd859882e5e297624d384b6993f7c9e683e722fb8a
  resnet50_barlow:
    description: ResNet-50 Barlow Twins, checkpoint officiel facebookresearch
    url: https://dl.fbaipublicfiles.com/barlowtwins/ep1000_bs2048_lrw0.2_lrb0.0048_lambd0.0051/resnet50.pth
    sha256: e00d00fcc75fc3b45f6707813973a7e9aefd546713d05a919fa209a9d4002114

resolutions: [112, 224]             # tailles d'entrée après recadrage

normalize:                          # ImageNet standard, identique pour les deux backbones
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

extraction:
  splits: [train, val, test]
  output_dir: features              # relatif à drive_root : <output_dir>/<backbone>/<résolution>/
  chunk_size: 8192                  # écrit par morceaux, reprise après coupure
  batch_size: 128
  num_workers: 2
  storage_dtype: float16            # suffisant pour des cosinus, moitié moins de place
  amp: false                        # calcul en float32
